name: E2E Playwright

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/app/components/users/**'
      - 'src/app/components/products/**'
      - 'src/app/components/inventory/**'
      - 'src/app/components/asistencia/**'
      - 'src/app/components/fleet/**'
      - 'src/app/hooks/useUsersRolesPersistence.ts'
      - 'src/app/hooks/useFleetPersistence.ts'
      - 'src/app/hooks/useInventoryPersistence.ts'
      - 'src/app/hooks/useAsistenciaPersistence.ts'
      - 'src/app/services/repository/fleetSql.ts'
      - 'e2e/**'
      - 'playwright.config.ts'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E completo (con credenciales)
        if: ${{ secrets.E2E_EMAIL != '' && secrets.E2E_PASSWORD != '' }}
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          CI: true
        run: npm run test:e2e
      - name: Smoke sin credenciales (login + rutas protegidas)
        if: ${{ secrets.E2E_EMAIL == '' || secrets.E2E_PASSWORD == '' }}
        env:
          CI: true
        run: npx playwright test e2e/auth.spec.ts e2e/routes.spec.ts
