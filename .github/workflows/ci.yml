name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke E2E (sin credenciales)
        env:
          CI: true
        run: npx playwright test e2e/auth.spec.ts e2e/routes.spec.ts e2e/go-live-transversal.spec.ts --grep "redirige al login"

  e2e-full:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E completo (requiere secrets en el repo)
        if: ${{ secrets.E2E_EMAIL != '' && secrets.E2E_PASSWORD != '' }}
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          CI: true
        run: npm run test:e2e
      - name: Aviso si faltan credenciales E2E
        if: ${{ secrets.E2E_EMAIL == '' || secrets.E2E_PASSWORD == '' }}
        run: echo "E2E completo omitido: configura E2E_EMAIL y E2E_PASSWORD en GitHub Secrets."
