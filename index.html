<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0b1e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e8eef8" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GrooFlow" />
    <meta name="description" content="GrooFlow — Caja chica, Cashback y Flota clínica" />
    <link rel="manifest" href="/grooflow/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/grooflow/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/grooflow/icons/icon-192.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
    <title>GrooFlow</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('grooflow_theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          var r = document.documentElement;
          r.classList.remove('light', 'dark');
          r.classList.add(t);
          r.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
